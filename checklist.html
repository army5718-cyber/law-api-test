<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무 체크리스트</title>
<style>
:root{
  --navy:#156082; --navy-d:#0f4a66; --bg:#ecf3f8; --line:#aac3d4; --card:#fff;
  --ink:#1e2832; --mute:#5a6e7d; --green:#38761d; --green-bg:#e2f0d9; --blue-bg:#d6eaf8; --amber:#fff8dc;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:19px}
header .sub{font-size:12px;color:#c8e2f2;flex:1;min-width:200px}
header .tot{font-weight:700;font-size:14px}
main{flex:1;display:flex;min-height:0}
/* left */
#left{width:380px;max-width:45%;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:4px;padding:6px 10px}
button:hover{background:#e6f1f8}
button.pri{background:var(--navy);color:#fff;font-weight:700}
button.pri:hover{background:var(--navy-d)}
#tree{flex:1;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 0}
.n{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;line-height:1.35;border-left:3px solid transparent}
.n:hover{background:#eef6fb}
.n.sel{background:#d6eaf8;border-left-color:var(--navy)}
.n .ar{width:14px;color:var(--navy);font-size:11px;flex:none;text-align:center}
.n .tx{flex:1}
.n .ct{font-size:12px;color:var(--mute);flex:none}
.n.l0{font-weight:700;color:var(--navy);background:#f4f9fc}
.n.l1{padding-left:22px}
.n.l2{padding-left:44px;font-size:13px}
.n.done .tx::after{content:"  [완료]";color:var(--green);font-size:12px;font-weight:700}
.empty{padding:20px;color:var(--mute);text-align:center}
/* right */
#right{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px;gap:8px;overflow:auto}
#crumb{font-size:12px;color:var(--mute)}
#title{font-size:19px;font-weight:700;color:#142838;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{padding:3px 10px;border-radius:3px;font-size:12px;font-weight:700}
.pill.cy{background:var(--green-bg);color:var(--green)}
.pill.tm{background:var(--blue-bg);color:var(--navy)}
.pill.off{background:#eee;color:#999;font-weight:400}
.cyc{display:flex;gap:4px}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:4px 0}
.head{display:flex;justify-content:space-between;align-items:center}
.head b{color:var(--navy);font-size:15px}
.bar{height:7px;background:#cddce6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.grp{margin-top:6px;font-weight:700;color:var(--navy);display:flex;gap:8px;align-items:center}
.grp .pill{font-weight:400}
.item{background:#fff;border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex;gap:10px;cursor:pointer}
.item:hover{border-color:var(--navy)}
.item.on{background:#f1f8ee;border-color:#9bc58a}
.item input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--navy)}
.item .body{flex:1;min-width:0}
.item .main{font-size:14.5px;line-height:1.5}
.item .sub{margin:4px 0 0;padding:0;list-style:none;color:#3b4b58;font-size:13px;line-height:1.5}
.item .sub li{padding-left:14px;position:relative}
.item .sub li::before{content:"-";position:absolute;left:2px}
.item .sub li.note{color:#6a5a1a;background:var(--amber);border-radius:3px;margin-top:2px;padding:1px 6px 1px 18px}
.item .sub li.note::before{content:"※";left:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:5px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--navy);background:#f4f9fc}
.card .t{font-weight:700}
.card .m{font-size:12px;color:var(--mute);margin-top:2px}
.card .bar{margin-top:6px;height:5px}
#hist{background:#fafcfe;border:1px solid var(--line);border-radius:4px;max-height:110px;overflow:auto;font-size:13px}
#hist div{padding:4px 10px;border-bottom:1px solid #e3edf3;display:flex;justify-content:space-between}
#hist div:last-child{border:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
#status{font-size:12px;color:var(--mute);margin-top:auto;padding-top:6px}
.guide{background:#fff;border:1px solid var(--line);border-radius:5px;padding:16px;line-height:1.8}
.guide h3{margin:0 0 6px;color:var(--navy)}
@media (max-width:760px){
  main{flex-direction:column}
  #left{width:100%;max-width:100%;border-right:0;border-bottom:1px solid var(--line);height:46vh;flex:none}
}
</style>
</head>
<body>
<header>
  <h1>업무 체크리스트</h1>
  <div class="sub">업무분야 ▶ 업무명 ▶ 세부업무 순서로 선택하면, 오른쪽에 <b>확인사항</b>이 나타납니다</div>
  <div class="tot" id="tot"></div>
</header>
<main>
  <section id="left">
    <div class="tools">
      <input id="q" placeholder="검색 (업무명·확인사항)" autocomplete="off">
      <button id="qc" title="검색어 지우기">×</button>
    </div>
    <div class="tools">
      <select id="cyc" title="점검주기 필터">
        <option value="">점검주기: 전체</option>
        <option>일</option><option>월</option><option>분기</option><option>반기</option><option>연간</option><option>기타</option>
      </select>
      <button id="ex">전체펼침</button>
      <button id="co">전체접기</button>
    </div>
    <div id="tree"></div>
  </section>
  <section id="right"></section>
</main>

<script>
var RAW = `# 사업관리업무
## 1. 매출 일마감 확인 | 회계 마감 이후 전일 마감내역 확인 | 일
### 1.1 마감업무체크 확인
o KESCOIN > 사업관리 > 사업소마감 > 일 마감업무 > 마감업무 체크
- 매출(사업별), 매출채권(사업별), 선수금(사업별), 보증금 탭의 영업보고서, 마감자료, 매출대장, 실시건수 업무별 금액 및 건수 비교
- 금액 및 건수가 상이할 경우 업무별 마감담당자에게 마감업무 확인 지시
## 2. 월마감 결재 확인 | 영업일 기준 익월 5일 이내 (본부→본사 보고: 영업일 기준 익월 7일 이내) | 월
### 2.1 마감업무체크 확인
o KESCOIN > 사업관리 > 사업소마감 > 일 마감업무 > 마감업무 체크
- 매출(사업별), 매출채권(사업별), 선수금(사업별), 보증금 탭의 영업보고서, 마감자료, 매출대장, 실시건수 업무별 금액 및 건수 비교
- 금액 및 건수가 상이할 경우 업무별 마감담당자에게 마감업무 확인 지시
### 2.2 장기선수금·매출채권 확인
o 미처리사유 명세서 관리
- (대상) 미처리월수 3개월 이상분 선수금(전기안전관리대행 제외), 미처리월수 3개월 이상분 매출채권(신용카드 매출채권 제외)
- (방법) 매월 마감시 미처리월수 3개월 이상분에 대해 사유 입력
- 부채감소의 달 운영실적 보고 시 첨부 제외(본사 수시 모니터링)
### 2.3 월마감 결재 세부내역 확인
o KESCOIN > 사업관리 > 사업소마감 > 월마감업무 > 월마감결재
- (대상) 첨부서류 일체
- (방법) 마감업무체크 차이내역 및 선수·매출채권 명세서 사유 확인 지시 / 영업보고서(합산) 및 기타 부속서류 내역 확인
o KESCOIN > 사업관리 > 사업소마감 > 월마감업무 > 월마감검산(마감요약)
- 각 차이내역 발생 시 업무별 마감담당자에게 마감업무 확인 지시
## 3. 부채 감소의 달 운영 | (내부결재) 월별 영업일 기준 5일 이내 / (본사 보고) 반기 익월 영업일 기준 10일 이내 | 월,반기
### 3.1 '부채감소의 달' 운영 실적 보고
o 월별 '부채감소의 달' 운영 실적 내부결재 여부
o 반기별 '부채감소의 달' 운영 실적 보고 여부(본부 지사분 취합 본사 보고)
o KESCOIN > 사업관리 > 사업소마감 > 월마감업무 > 월마감검산(마감요약)
- 전년 동기대비 증감 확인하여 증가 시 사유 파악 및 감소 추진계획 수립
### 3.2 선수금·매출채권 명세서 확인
o KESCOIN > 사업관리 > 수금관리 > 수금관리/출력 > 매출채권 명세서
- 업무별, 기간별 매출채권 명세 및 금액 확인
o KESCOIN > 사업관리 > 수금관리 > 수금관리/출력 > 선수금 명세서
- 업무별, 기간별 선수금 명세 및 금액 확인
o 공통사항
- 3개월 이상 장기선수금·매출채권 대상 부채 집중 감소 추진
- 장기 선수금·매출채권 대상 고객 협조전 및 안내 등기우편 발송 작성 등 적정한 조치를 하였는지 여부
## 4. 대손처리대상 파악 보고 | 연도 말 본사 공문 일정에 따라 보고 | 연간
### 4.1 대손처리관련 규정 확인
o 상법 제64조에 의거 채권 소멸시효(5년) 확인
o 법인세법 시행령 제19조의2에 의거 매출채권 중 회수 불가능분 조항 확인
o 업무규정 시행세칙 제41조(대손처리 서류) 확인 여부
### 4.2 대손처리대상 확정 및 보고
o KESCOIN > 사업관리 > 수금관리 > 수금관리/출력 > 매출채권 명세서
- 업무별, 기간별 매출채권 명세 및 금액 확인
- 채권소멸시효(상법 5년) 완료분 확인(해지시점으로부터 기간 경과)
- 대손처리대상 고객리스트 정리 및 제출(고객방문조사보고서 첨부 필수)
## 5. 미환불 보증금 수익처리 대상 보고 | 익년도 1월 10일까지 | 연간
### 5.1 미환불 보증금 수익처리 규정 확인
o 관리업무요령 제20조(대체 및 환불)에 따라 대행 계약 해지 시 고객의 보증금은 미납 수수료를 대체 충당 후 환불해야 함 확인
o 업무규정 시행세칙 제12조의3(잡수입)에 따라 법정 채권소멸시효 기간 경과 시 미환불 고객은 잡수입 처리함을 확인
### 5.2 미환불 보증금 수익처리 대상 확정 및 보고
o KESCOIN > 사업관리 > 계약업무 > 계·해지업무/조회·출력 > 보증금현황, 보증금대장, 보증금 환불명세서 출력
- 계약구분별, 기간별 보증금 명세 및 금액 확인
- 채권소멸시효(상법 5년) 완료분 확인(해지시점으로부터 기간 계산 경과)
- 보증금 수익처리 대상 고객 리스트 정리 및 제출
## 6. 법정월/환불/계약보정 내역 확인 | 수시 확인하여 '승인' 처리 | 일
### 6.1 관련내역 확인 후 승인
o KESCOIN > 사업관리 > 공통관리 > 법정월/환불/계약보정
- 업무별 담당자가 계약·비계약 환불, 계약고객 법정월 조정감 또는 계약보정으로 수수료 변동이 생기는 경우 상기의 메뉴를 이용하여 사유를 입력
- 매일 '조회' 버튼을 클릭하여 리스트를 확인하고 업무담당자에게 사유를 문의하여 판단 후 건별 '승인' 함
# 고객만족업무
## 1. 전화모니터링 조사 | 상반기, 하반기 연 2회 | 반기
### 1.1 전화응대 등 CS 교육
o 상반기, 하반기 전화모니터링 조사 시기 파악
o 부서장 주관 교육 및 캠페인 실시
- 전화모니터링 결과 분석 및 취약요소 개선 노력
## 2. 공공기관 고객만족도 조사 | 연도별 9월 말까지 | 연간
### 2.1 고객리스트 검토
o 고객 정보 누락분(휴대전화, 유선번호 등) 및 오류 입력분 수정
- 9개 사업 고객리스트 검토(자가용 사용전검사, 자가용 정기검사, 사용전점검, 정기점검, 안전관리대행, 여러사람이용시설안전점검, 자가용안전진단, 일반용안전진단, 정밀안전진단)
## 3. 고객서비스현장 이행실태 자체점검 | 연도별 6월 말까지 | 연간
### 3.1 실태점검 결과 입력
o KESCOIN > 사업관리 > CS관리 > 고객서비스현장실태점검
- 점검자 : CS리더
- 부분별 고객서비스 이행기준 이행여부 입력
- 잘못된 서비스의 시정 및 보상 선택 이행여부 입력
## 4. 미리톡CSI | 월별 점수 확인 및 S-VOC 발송 | 월
### 4.1 월단위 미리톡CSI 결과 보고
o KESCOIN > 사업관리 > CS관리 > 미리톡CSI (자체만족도) > 미리톡CSI 결과
o 사업소·월별 점수 확인
o S-VOC 해피톡 발송
# 성과관리업무
## 1. 내부경영평가 편람 확정 | 당해연도 내부경영평가 편람 확정 세부내용 확인 | 연간
### 1.1 익년도 지표 변경 의견조회 (12월)
o 당해연도 평가운영방향 및 사업소 공동지표 변경(안)에 대한 전사 의견수렴
### 1.2 내부경영평가 편람 확정 (3월)
o 당해연도 사업소 내부조직평가 핵심성과지표(KPI) 확인 / 변경사항 시달
- 본부 및 지사 공동 KPI에 대한 평가방법, 가중치, 평가위임부서 등
### 1.3 핵심성과지표 의견조회 (7월~8월)
o 정부정책, 경영환경 변화, 법령 개정 등에 따른 지표개선 의견수렴
## 2. 사업소 핵심성과지표를 반영한 세부 업무계획 수립 및 이행 | 핵심성과지표를 반영 업무계획 이행 실적 확인 | 월
## 3. 핵심성과지표 실적관리 및 모니터링 | 사업소 핵심성과지표 진도율 관리 및 차별화된 우수사례 발굴 / 매월 15일 | 월
### 3.1 이행실적 진도 관리 (연중)
o 핵심성과지표 이행 실적 진도 관리 및 모니터링

o 2. 첨부된 요청공문이 공문의 형식으로 작성되었는가
* 이메일, 단순 계획 보고 문서, 전화 요청은 인정 불가
o 3. 첨부된 요청공문에 기재된 장소, 시간 등이 실제 보고한 사항과 일치하는가
o 4. 근무시간 내·외 실시 여부 확인
- 가. '근무시간 내'일 경우 → 직무수행과의 관련성이 있는지
- 나. '근무시간 외'일 경우 → 본인 업무에 지장이 없는 범위인지
o 5. 외부강의 사례금(원고료 포함)을 적정하게 지급 받았는가
- 상한액 : 1시간 40만원, 1회 총액 60만원 [1시간 상한액의 100분의 150]
o 6. 공사 출장여비를 지급 받은 경우 외부강의 요청기관에서 교통편·여비 관련한 실비를 지급 받지 않았는가(중복 지급 불가)
o 7. 외부강의 출강 시 신고한 근태가 실제 근태와 일치하는가
o 8. 외부강의를 실시할 경우 월 3회를 초과하지 않고 실시 하였는가
- 사전 겸직 허가 직원일 경우 월 횟수 제한없음
# 교육업무
## 1. 교육실적 입력 | 구조화된 현장교육 등을 마친 달 말까지 e-HRD 실적 입력 및 내부 결재 | 월
### 1.1 구조화된 현장교육 | 월
o 매월 월례조회시 구조화된 현장교육 실시 및 e-HRD시스템 실적 입력
- 2시간(소양교육 30분, 현장교육 30분, 안전교육 60분)
* 산업안전보건법 시행규칙 제26조에 의해 매월 안전보건교육을 내근직 1시간, 현장직·공무직 2시간 실시해야 하므로 현장직·공무직의 경우 안전보건교육(60분) 외 60분 추가 교육
### 1.2 직무중심 역량 강화 교육 | 월
o 매월 직무교육 실시(2H) 및 e-HRD시스템 실적 입력 확인
- 본부장, 지사장 및 고객지원부장 : 사이버연수원 러닝 교육 중 계층역량교육(1-2급) 선택하여 수강
- 경영관리직군 : 사이버연수원 러닝 교육 중 직무역량교육(직무행동역량) 선택하여 수강
- 기술직군 : 인재개발원에서 지정하는 테마별 교육 실시 및 실적 입력
* 본부장, 지사장 및 고객지원부장, 경영관리직군 실적은 인재개발원 별도 취합
* 기술직군은 e-HRD시스템 전자결재를 통한 실적 입력 (과정명 「직무중심 역량 강화 테마교육(00월)」), 구조화된 현장교육과는 별도로 입력
`;
var CYCLES = ["일","월","분기","반기","연간","기타"];

/* ---------- 데이터 파싱 ---------- */
function parse(raw){
  var areas=[], A=null, T=null, S=null, G=null, I=null;
  function cyc(s){ return (s||"").split(",").map(function(x){return x.trim()}).filter(Boolean); }
  function newSub(name,cy){ S={name:name,cycle:cyc(cy),items:[]}; T.subs.push(S); G=null; I=null; }
  raw.split("\n").forEach(function(ln){
    ln=ln.replace(/\s+$/,""); if(!ln) return;
    var p;
    if(ln.indexOf("# ")===0){ A={name:ln.slice(2).trim(),tasks:[]}; areas.push(A); }
    else if(ln.indexOf("## ")===0){ p=ln.slice(3).split(" | "); T={name:p[0].trim(),timing:(p[1]||"").trim(),cycle:cyc(p[2]),subs:[]}; A.tasks.push(T); S=null; G=null; I=null; }
    else if(ln.indexOf("### ")===0){ p=ln.slice(4).split(" | "); newSub(p[0].trim(),p[1]); }
    else if(ln.indexOf("@ ")===0){ p=ln.slice(2).split(" | "); G={name:p[0].trim(),cycle:cyc(p[1])}; I=null; }
    else if(/^o /.test(ln)){ I={text:ln.slice(2),subs:[],group:G}; S.items.push(I); }
    else if(/^[-*] /.test(ln)){
      if(!I){ I={text:"",subs:[],group:G}; S.items.push(I); }
      I.subs.push({t:ln.slice(2),note:ln.charAt(0)==="*"});
    }
  });
  return areas;
}
var AREAS=parse(RAW);

/* 리프(세부업무) 평탄화 + 아이디 부여 */
var LEAVES={};
AREAS.forEach(function(a,ai){
  a.id="a"+ai;
  a.tasks.forEach(function(t,ti){
    t.id="a"+ai+"t"+ti; t.area=a;
    if(!t.subs.length){   // 세부업무가 없는 업무는 자기 자신이 점검 단위
      t.subs.push({name:t.name,cycle:[],items:[{text:t.timing||t.name,subs:[],group:null}],self:true});
    }
    t.subs.forEach(function(s,si){
      s.id="a"+ai+"t"+ti+"s"+si; s.task=t; s.area=a;
      var cy=s.cycle.length?s.cycle:null;
      if(!cy){ // 그룹별 주기 합집합 → 없으면 업무 주기 상속
        var u={}; s.items.forEach(function(it){ if(it.group) it.group.cycle.forEach(function(c){u[c]=1;}); });
        cy=Object.keys(u).length?CYCLES.filter(function(c){return u[c];}):t.cycle;
      }
      s.cyc=cy; LEAVES[s.id]=s;
    });
  });
});

/* ---------- 저장소 (localStorage) ---------- */
var KEY="work-checklist-v1", ST={checks:{},hist:[]};
try{ var j=localStorage.getItem(KEY); if(j) ST=JSON.parse(j); }catch(e){}
ST.checks=ST.checks||{}; ST.hist=ST.hist||[];
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
function doneOf(s){ var c=ST.checks[s.id]||[],n=0; for(var i=0;i<s.items.length;i++) if(c[i]) n++; return n; }
function isDone(s){ return s.items.length>0 && doneOf(s)===s.items.length; }
function taskStat(t){ var d=0; t.subs.forEach(function(s){ if(isDone(s)) d++; }); return [d,t.subs.length]; }
function areaStat(a){ var d=0,n=0; a.tasks.forEach(function(t){ var x=taskStat(t); d+=x[0]; n+=x[1]; }); return [d,n]; }

/* ---------- 상태 ---------- */
var open={}, sel=null, $=function(i){return document.getElementById(i);};
AREAS[0] && (open[AREAS[0].id]=true);

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function kw(){ return $("q").value.trim().toLowerCase(); }
function cyf(){ return $("cyc").value; }
function subText(s){
  return (s.area.name+"|"+s.task.name+"|"+s.name+"|"+s.task.timing+"|"+s.items.map(function(i){return i.text+" "+i.subs.map(function(x){return x.t;}).join(" ");}).join("|")).toLowerCase();
}
function subOk(s){
  var k=kw(), c=cyf();
  if(c && s.cyc.indexOf(c)<0) return false;
  if(k && subText(s).indexOf(k)<0) return false;
  return true;
}

/* ---------- 트리 ---------- */
function node(cls,id,arrow,text,count,extra){
  return '<div class="n '+cls+(sel===id?' sel':'')+(extra||'')+'" data-id="'+id+'"><span class="ar">'+arrow+'</span><span class="tx">'+esc(text)+'</span>'+(count?'<span class="ct">'+count+'</span>':'')+'</div>';
}
function buildTree(){
  var h="", searching=!!(kw()||cyf()), any=false;
  AREAS.forEach(function(a){
    var tasks=[];
    a.tasks.forEach(function(t){ var ss=t.subs.filter(subOk); if(ss.length) tasks.push([t,ss]); });
    if(!tasks.length) return;
    any=true;
    var as=areaStat(a), ao=searching||open[a.id];
    h+=node("l0",a.id,ao?"▼":"▶",a.name,as[0]+"/"+as[1]);
    if(!ao) return;
    tasks.forEach(function(p){
      var t=p[0], ss=p[1], to=searching||open[t.id], ts=taskStat(t);
      if(t.subs.length===1&&t.subs[0].self){   // 세부업무 없는 업무는 한 줄로
        h+=node("l1",t.subs[0].id," ",t.name,"",isDone(t.subs[0])?" done":"");
        return;
      }
      h+=node("l1",t.id,to?"▼":"▶",t.name,ts[0]+"/"+ts[1]);
      if(to) ss.forEach(function(s){ h+=node("l2",s.id,"└",s.name,"",isDone(s)?" done":""); });
    });
  });
  $("tree").innerHTML=any?h:'<div class="empty">검색 결과가 없습니다</div>';
  var tot=0,dn=0; Object.keys(LEAVES).forEach(function(k){ tot++; if(isDone(LEAVES[k])) dn++; });
  $("tot").textContent="전체 확인완료  "+dn+" / "+tot+" 건";
}
function find(id){
  for(var i=0;i<AREAS.length;i++){
    if(AREAS[i].id===id) return {k:"area",o:AREAS[i]};
    for(var j=0;j<AREAS[i].tasks.length;j++){
      if(AREAS[i].tasks[j].id===id) return {k:"task",o:AREAS[i].tasks[j]};
    }
  }
  return LEAVES[id]?{k:"sub",o:LEAVES[id]}:null;
}

$("tree").addEventListener("click",function(e){
  var n=e.target.closest(".n"); if(!n) return;
  var id=n.getAttribute("data-id"), f=find(id);
  if(f&&(f.k==="area"||f.k==="task") && !(kw()||cyf())){ open[id]=sel===id?!open[id]:true; }
  select(id);
});

function select(id){
  sel=id; var left=$("tree").scrollTop; buildTree(); $("tree").scrollTop=left; render();
}

/* ---------- 오른쪽 화면 ---------- */
function cycBadges(list){
  return '<span class="cyc">'+CYCLES.map(function(c){ return '<span class="pill '+(list.indexOf(c)>=0?'cy':'off')+'">'+c+'</span>'; }).join("")+'</span>';
}
function bar(d,n){ return '<div class="bar"><i style="width:'+(n?Math.round(d*100/n):0)+'%"></i></div>'; }

function render(){
  var R=$("right"), f=sel&&find(sel);
  if(!f){
    R.innerHTML='<div class="guide"><h3>사용 방법</h3>① 왼쪽에서 <b>업무분야</b>를 눌러 펼칩니다.<br>② <b>업무명</b>(예: 1. 매출 일마감 확인) → <b>세부업무</b>를 선택합니다.<br>③ 오른쪽에 <b>확인사항</b>이 나오면 항목별로 체크하고 <b>점검 완료 기록</b>을 누르세요.<br>④ 검색·점검주기 필터로 오늘 해야 할 업무만 골라볼 수 있습니다.<br><br>업무분야 '+AREAS.length+'개 · 점검 단위 '+Object.keys(LEAVES).length+'건<br><span style="color:#5a6e7d;font-size:12px">체크·이력은 이 브라우저에 자동 저장됩니다.</span></div><div id="status"></div>';
    return;
  }
  var h="";
  if(f.k==="area"){
    var a=f.o, st=areaStat(a);
    h+='<div id="crumb">업무분야</div><h2 id="title">'+esc(a.name)+'</h2><hr>';
    h+='<div class="head"><b>업무 목록</b><span>'+st[0]+' / '+st[1]+' 완료</span></div>'+bar(st[0],st[1]);
    a.tasks.forEach(function(t){
      var x=taskStat(t), tid=(t.subs.length===1&&t.subs[0].self)?t.subs[0].id:t.id;
      h+='<div class="card" data-go="'+tid+'"><div class="t">'+esc(t.name)+'</div><div class="m">'+esc(t.timing||"")+(t.cycle.length?'  ·  점검주기 '+t.cycle.join(", "):'')+'  ·  '+x[0]+'/'+x[1]+'</div>'+bar(x[0],x[1])+'</div>';
    });
  } else if(f.k==="task"){
    var t=f.o, ts=taskStat(t);
    h+='<div id="crumb">'+esc(t.area.name)+'</div><h2 id="title">'+esc(t.name)+'</h2>';
    h+='<div class="badges">'+cycBadges(t.cycle)+(t.timing?'<span class="pill tm">'+esc(t.timing)+'</span>':'')+'</div><hr>';
    h+='<div class="head"><b>세부업무</b><span>'+ts[0]+' / '+ts[1]+' 완료</span></div>'+bar(ts[0],ts[1]);
    t.subs.forEach(function(s){
      h+='<div class="card" data-go="'+s.id+'"><div class="t">'+esc(s.name)+(isDone(s)?' <span style="color:var(--green)">[완료]</span>':'')+'</div><div class="m">확인사항 '+s.items.length+'개  ·  '+doneOf(s)+' 확인'+(s.cyc.length?'  ·  '+s.cyc.join(", "):'')+'</div>'+bar(doneOf(s),s.items.length)+'</div>';
    });
  } else {
    var s=f.o, t2=s.task, c=ST.checks[s.id]||[], d=doneOf(s);
    h+='<div id="crumb">'+esc(s.area.name)+'  ▶  '+(s.self?'':esc(t2.name)+'  ▶  ')+esc(s.name)+'</div>';
    h+='<h2 id="title">'+esc(s.name)+'</h2>';
    h+='<div class="badges">'+cycBadges(s.cyc)+(t2.timing&&!s.self?'<span class="pill tm">'+esc(t2.timing)+'</span>':'')+'</div><hr>';
    h+='<div class="head"><b>확인사항</b><span id="prog">'+d+' / '+s.items.length+' 확인</span></div>'+bar(d,s.items.length);
    var lastG=null;
    s.items.forEach(function(it,i){
      if(it.group&&it.group!==lastG){ h+='<div class="grp">'+esc(it.group.name)+(it.group.cycle.length?'<span class="pill tm">'+it.group.cycle.join(" · ")+'</span>':'')+'</div>'; }
      lastG=it.group;
      h+='<label class="item'+(c[i]?' on':'')+'"><input type="checkbox" data-i="'+i+'"'+(c[i]?' checked':'')+'><div class="body"><div class="main">'+esc(it.text)+'</div>';
      if(it.subs.length) h+='<ul class="sub">'+it.subs.map(function(x){return '<li class="'+(x.note?'note':'')+'">'+esc(x.t)+'</li>';}).join("")+'</ul>';
      h+='</div></label>';
    });
    h+='<div class="head" style="margin-top:8px"><b>최근 점검 이력</b></div><div id="hist">'+histHtml(s.id)+'</div>';
    h+='<div class="acts"><button class="pri" id="rec">점검 완료 기록</button><button id="all">전체 체크</button><button id="rst">체크 초기화</button><button id="csv">이력 CSV 저장</button></div>';
  }
  h+='<div id="status"></div>';
  R.innerHTML=h;
}
function histHtml(id){
  var l=ST.hist.filter(function(x){return x.id===id;}).slice(-6).reverse();
  if(!l.length) return '<div style="color:#5a6e7d">기록된 점검 이력이 없습니다</div>';
  return l.map(function(x){ return '<div><span>'+esc(x.at)+'</span><span>'+x.d+' / '+x.n+' 확인</span></div>'; }).join("");
}
function msg(t){ var e=$("status"); if(e) e.textContent=t; }

$("right").addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){ var id=g.getAttribute("data-go"), f=find(id); if(f){ open[f.o.area?f.o.area.id:f.o.id]=true; if(f.o.task) open[f.o.task.id]=true; if(f.k==="task"||f.k==="sub"){ var a=(f.o.area||f.o); open[a.id]=true; } } select(id); return; }
  var s=LEAVES[sel]; if(!s) return;
  var b=e.target.id;
  if(b==="rec"){
    var d=new Date(), p=function(n){return (n<10?"0":"")+n;};
    var at=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
    ST.hist.push({id:s.id,area:s.area.name,task:s.task.name,sub:s.name,at:at,d:doneOf(s),n:s.items.length}); save();
    render(); msg("점검 이력을 기록했습니다 ("+at+")");
  } else if(b==="all"){ ST.checks[s.id]=s.items.map(function(){return true;}); save(); select(sel); }
  else if(b==="rst"){ delete ST.checks[s.id]; save(); select(sel); msg("체크를 초기화했습니다"); }
  else if(b==="csv"){ exportCsv(); }
});
$("right").addEventListener("change",function(e){
  var cb=e.target; if(cb.type!=="checkbox") return;
  var s=LEAVES[sel]; if(!s) return;
  var c=ST.checks[s.id]||(ST.checks[s.id]=[]); c[+cb.getAttribute("data-i")]=cb.checked; save();
  cb.closest(".item").classList.toggle("on",cb.checked);
  var d=doneOf(s); $("prog").textContent=d+" / "+s.items.length+" 확인";
  document.querySelector(".bar i").style.width=Math.round(d*100/s.items.length)+"%";
  var left=$("tree").scrollTop; buildTree(); $("tree").scrollTop=left;
});
function exportCsv(){
  var rows=[["업무분야","업무명","세부업무","기록일시","확인","전체"]].concat(ST.hist.map(function(x){return [x.area,x.task,x.sub,x.at,x.d,x.n];}));
  var csv="﻿"+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="점검이력.csv"; a.click();
  msg("점검이력.csv 를 저장했습니다");
}

/* ---------- 상단 컨트롤 ---------- */
$("q").addEventListener("input",function(){ sel=null; buildTree(); render(); });
$("cyc").addEventListener("change",function(){ sel=null; buildTree(); render(); });
$("qc").addEventListener("click",function(){ $("q").value=""; $("q").focus(); sel=null; buildTree(); render(); });
$("ex").addEventListener("click",function(){ AREAS.forEach(function(a){ open[a.id]=true; a.tasks.forEach(function(t){ open[t.id]=true; }); }); sel=null; buildTree(); render(); });
$("co").addEventListener("click",function(){ open={}; sel=null; buildTree(); render(); });

buildTree(); render();
</script>
